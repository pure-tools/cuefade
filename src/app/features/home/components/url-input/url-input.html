<div class="max-w-2xl mx-auto space-y-3">
  <div class="flex gap-2">
    <input
      [(ngModel)]="url"
      type="url"
      placeholder="Paste a YouTube playlist URL..."
      class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-yellow-400 transition-colors"
      (keyup.enter)="loadPlaylist()"
    />
    <button
      class="px-5 py-3 rounded-lg bg-yellow-400 text-zinc-950 font-semibold text-sm hover:bg-yellow-300 transition-colors disabled:opacity-50"
      (click)="loadPlaylist()"
      [disabled]="loading() || !url.trim()"
    >{{ loading() ? 'Loading...' : 'Load' }}</button>
    @if (url.trim()) {
      <button
        class="px-3 py-3 rounded-lg border border-zinc-700 text-zinc-400 text-sm hover:border-zinc-500 hover:text-zinc-200 transition-colors disabled:opacity-50"
        (click)="url = ''; error.set(''); cleared.emit()"
        [disabled]="loading()"
        title="Clear"
      >✕</button>
    }
  </div>
  @if (error()) {
    <p class="text-red-400 text-sm">{{ error() }}</p>
  }
</div>
