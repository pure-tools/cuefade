@if (visible()) {
  <div
    class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4"
    (click)="close.emit()"
  >
    <div
      class="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-md w-full p-8 space-y-6"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="flex items-start justify-between">
        <div>
          <h2 class="text-2xl font-black text-yellow-400">CueFade Pro</h2>
          <p class="text-zinc-500 text-sm mt-0.5">One-time purchase · no subscription</p>
        </div>
        <button class="text-zinc-500 hover:text-zinc-200 text-xl leading-none" (click)="close.emit()">×</button>
      </div>

      <!-- Price -->
      @if (!isNativeApp) {
        <div class="flex items-baseline gap-2">
          <span class="text-5xl font-black">$10</span>
          <span class="text-zinc-500 text-sm">forever</span>
        </div>
      }

      <!-- Features -->
      <ul class="space-y-2.5">
        @for (f of proFeatures; track f) {
          <li class="flex items-start gap-2.5 text-sm">
            <span class="text-yellow-400 mt-0.5 shrink-0">✓</span>
            <span class="text-zinc-300">{{ f }}</span>
          </li>
        }
      </ul>

      <!-- CTA -->
      <div class="space-y-3 pt-2">
        @if (error()) {
          <p class="text-red-400 text-xs">{{ error() }}</p>
        }
        @if (info()) {
          <p class="text-zinc-400 text-xs">{{ info() }}</p>
        }
        <button
          (click)="unlock()"
          [disabled]="loading()"
          class="block w-full py-3 rounded-xl bg-yellow-400 text-zinc-950 font-bold text-center text-sm hover:bg-yellow-300 transition-colors disabled:opacity-50"
        >
          @if (isNativeApp) {
            {{ loading() ? 'Processing…' : 'Unlock Pro' }}
          } @else {
            {{ loading() ? 'Redirecting…' : 'Unlock for $10' }}
          }
        </button>
        @if (canRestore) {
          <button
            (click)="restore()"
            [disabled]="restoring() || loading()"
            class="block w-full py-2 text-zinc-400 text-sm hover:text-zinc-200 transition-colors disabled:opacity-50"
          >
            {{ restoring() ? 'Restoring…' : 'Restore purchases' }}
          </button>
        }
        <!-- External payment/donation links are not allowed inside the store apps -->
        @if (!isNativeApp) {
          <a
            [href]="kofiUrl"
            target="_blank"
            rel="noopener"
            class="block w-full py-2 rounded-xl border border-zinc-700 text-zinc-400 font-medium text-center text-sm hover:border-zinc-500 hover:text-zinc-200 transition-colors"
          >
            Support on Ko-fi
          </a>
        }
      </div>

    </div>
  </div>
}
