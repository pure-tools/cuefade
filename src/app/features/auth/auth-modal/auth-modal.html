<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" (click)="close.emit()">
  <div class="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-sm w-full p-8 space-y-6" (click)="$event.stopPropagation()">

    <div class="flex items-start justify-between">
      <h2 class="text-xl font-black text-white">
        {{ mode() === 'login' ? 'Sign in' : 'Create account' }}
      </h2>
      <button class="text-zinc-500 hover:text-zinc-200 text-xl leading-none" (click)="close.emit()">×</button>
    </div>

    <div class="space-y-3">
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Email"
        autocomplete="email"
        class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white placeholder-zinc-500 text-sm focus:outline-none focus:border-yellow-400"
      />
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Password"
        autocomplete="current-password"
        class="w-full px-4 py-3 rounded-xl bg-zinc-800 border border-zinc-700 text-white placeholder-zinc-500 text-sm focus:outline-none focus:border-yellow-400"
        (keyup.enter)="submit()"
      />
    </div>

    @if (error()) {
      <p class="text-sm" [class]="error().startsWith('Check') ? 'text-green-400' : 'text-red-400'">
        {{ error() }}
      </p>
    }

    <button
      (click)="submit()"
      [disabled]="loading()"
      class="w-full py-3 rounded-xl bg-yellow-400 text-zinc-950 font-bold text-sm hover:bg-yellow-300 transition-colors disabled:opacity-50"
    >
      {{ loading() ? 'Please wait…' : mode() === 'login' ? 'Sign in' : 'Create account' }}
    </button>

    <p class="text-center text-sm text-zinc-500">
      {{ mode() === 'login' ? "Don't have an account?" : 'Already have an account?' }}
      <button class="text-yellow-400 hover:text-yellow-300 ml-1" (click)="toggleMode()">
        {{ mode() === 'login' ? 'Sign up' : 'Sign in' }}
      </button>
    </p>

  </div>
</div>
