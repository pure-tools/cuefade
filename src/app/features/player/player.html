<div class="flex flex-col h-screen bg-zinc-950 text-zinc-100">
  <!-- Top bar -->
  <header class="flex items-center gap-4 px-4 py-3 border-b border-zinc-800 flex-shrink-0">
    <button
      class="text-zinc-500 hover:text-zinc-200 transition-colors text-sm"
      (click)="goHome()"
    >← Back</button>
    <span class="text-yellow-400 font-bold tracking-widest text-sm uppercase">CueFade</span>
    <span class="text-zinc-600 text-sm">{{ queue.tracks().length }} tracks in queue</span>
  </header>

  <!-- Main layout: stage + queue -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Video stage -->
    <div class="flex flex-col flex-1 overflow-hidden">
      <div class="flex-1 p-4">
        <app-player-stage class="block h-full" />
      </div>
      <!-- Transport bar -->
      <app-transport (playPause)="onPlayPause()" />
    </div>

    <!-- Queue sidebar -->
    <aside class="w-80 flex-shrink-0 border-l border-zinc-800">
      <app-queue-panel class="block h-full" />
    </aside>
  </div>
</div>
