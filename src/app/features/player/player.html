<div class="flex flex-col h-screen bg-zinc-950 text-zinc-100">
  <!-- Top bar -->
  <header class="flex items-center gap-4 px-4 py-3 border-b border-zinc-800 flex-shrink-0">
    <button
      class="flex items-center gap-1.5 text-zinc-500 hover:text-zinc-200 transition-colors flex-shrink-0"
      (click)="goHome()"
      title="Home"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9 21 9 12 15 12 15 21"/>
      </svg>
      <span class="text-sm hidden sm:inline">Home</span>
    </button>
    <span class="text-yellow-400 font-bold tracking-widest text-sm uppercase">CueFade</span>
    <span class="text-zinc-600 text-sm">{{ queue.tracks().length }} tracks</span>

    <!-- Queue toggle — mobile only -->
    <button
      class="ml-auto md:hidden flex items-center gap-1.5 text-xs px-3 py-1.5 rounded border border-zinc-700 text-zinc-400 hover:border-yellow-400 hover:text-yellow-400 transition-colors"
      (click)="toggleQueue()"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="15" y2="18"/>
      </svg>
      Queue
    </button>
  </header>

  <!-- Main layout -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Video stage + transport -->
    <div class="flex flex-col flex-1 overflow-hidden">
      <div class="flex-1 p-4">
        <app-player-stage class="block h-full" />
      </div>
      <app-transport (playPause)="onPlayPause()" />
    </div>

    <!-- Mobile backdrop -->
    @if (mobile.isMobile() && showQueue()) {
      <div
        class="absolute inset-0 bg-black/60 z-10"
        (click)="toggleQueue()"
      ></div>
    }

    <!-- Queue panel: sidebar on desktop, slide-up sheet on mobile -->
    <aside
      class="absolute inset-x-0 bottom-0 h-[65vh] z-20 transition-transform duration-300
             md:relative md:h-auto md:w-80 md:flex-shrink-0 md:border-l md:border-zinc-800 md:translate-y-0"
      [class.translate-y-full]="!showQueue()"
    >
      <!-- Mobile drag handle -->
      <div class="flex justify-center pt-2 pb-1 md:hidden bg-zinc-900 rounded-t-2xl">
        <div class="w-10 h-1 rounded-full bg-zinc-700"></div>
      </div>
      <app-queue-panel class="block h-full" />
    </aside>
  </div>
</div>
