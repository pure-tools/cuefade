<div class="flex flex-col h-full bg-zinc-900 rounded-lg">
  <!-- Header -->
  <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800">
    <h2 class="text-sm font-semibold text-zinc-200">Queue</h2>
    <div class="flex items-center gap-3">
      <span class="text-xs text-zinc-500">{{ queue.tracks().length }} tracks</span>
      <button
        class="flex items-center gap-1 text-xs text-zinc-500 hover:text-zinc-200 transition-colors"
        (click)="exportPlaylist()"
        [title]="gates.canExportPlaylist() ? 'Copy tracklist with timestamps' : 'Upgrade to Pro to export'"
      >
        @if (exportCopied()) {
          <span class="text-yellow-400">Copied!</span>
        } @else {
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Export
          @if (!gates.canExportPlaylist()) {
            <span class="text-[9px] font-bold text-yellow-400">PRO</span>
          }
        }
      </button>
    </div>
  </div>

  <!-- Drag-drop list -->
  <div
    cdkDropList
    [cdkDropListData]="queue.tracks()"
    (cdkDropListDropped)="onDrop($event)"
    class="flex-1 overflow-y-auto p-2 space-y-1"
  >
    @for (track of queue.tracks(); track track.id; let i = $index) {
      <div cdkDrag class="group/track-wrap relative cursor-grab active:cursor-grabbing">
        <!-- Drag preview placeholder -->
        <div *cdkDragPlaceholder class="h-14 bg-zinc-700/50 rounded-lg border border-dashed border-zinc-600"></div>

        <app-track-card
          [track]="track"
          [index]="i"
          [isCurrent]="i === queue.currentIndex()"
          [isNext]="i === queue.nextIndex()"
          (playNext)="onPlayNext($event)"
          (cueChange)="onCueChange($event)"
        />

        <!-- Insert area: shown below each card on hover -->
        @if (insertOpenAt() === i) {
          <div class="flex items-center gap-2 mx-1 mb-1 bg-zinc-800 rounded-lg px-3 py-2 border border-zinc-700">
            <input
              [(ngModel)]="insertUrl"
              type="url"
              placeholder="YouTube URL or video ID"
              class="flex-1 bg-transparent text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none"
              (keyup.enter)="confirmInsert()"
              (keyup.escape)="cancelInsert()"
              autofocus
            />
            <button
              class="text-xs px-2 py-1 rounded bg-yellow-400 text-zinc-950 font-semibold disabled:opacity-40 whitespace-nowrap"
              (click)="confirmInsert()"
              [disabled]="!insertUrl.trim()"
            >Add</button>
            <button
              class="text-zinc-500 hover:text-zinc-300 text-sm leading-none"
              (click)="cancelInsert()"
            >×</button>
          </div>
          @if (insertError()) {
            <p class="text-xs text-red-400 px-2 pb-1">{{ insertError() }}</p>
          }
        } @else {
          <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 z-10 opacity-0 group-hover/track-wrap:opacity-100 transition-opacity">
            <button
              class="w-5 h-5 rounded-full bg-zinc-700 hover:bg-yellow-400 text-zinc-400 hover:text-zinc-950 flex items-center justify-center transition-colors"
              (click)="openInsert(i); $event.stopPropagation()"
              title="Insert track here"
            >
              <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor">
                <rect x="4" y="0" width="2" height="10" rx="1"/>
                <rect x="0" y="4" width="10" height="2" rx="1"/>
              </svg>
            </button>
          </div>
        }
      </div>
    }
  </div>
</div>
