<div class="bg-zinc-800 rounded-lg p-4 space-y-3">
  <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Cue Points</p>

  <!-- Cue In -->
  <div class="space-y-1">
    <div class="flex justify-between text-xs text-zinc-400">
      <span>Cue In (skip intro)</span>
      <span class="text-yellow-400 font-mono">{{ formatTime(cueIn) }}</span>
    </div>
    <input
      type="range"
      class="cue-slider"
      [min]="0"
      [max]="maxSeconds"
      [value]="cueIn"
      (input)="onCueInChange($any($event.target).value)"
    />
  </div>

  <!-- Cue Out -->
  <div class="space-y-1">
    <div class="flex justify-between text-xs text-zinc-400">
      <span>Cue Out (start fade)</span>
      <span class="text-yellow-400 font-mono">{{ formatTime(cueOut) }}</span>
    </div>
    <input
      type="range"
      class="cue-slider"
      [min]="0"
      [max]="maxSeconds"
      [value]="cueOut"
      (input)="onCueOutChange($any($event.target).value)"
    />
  </div>
</div>
