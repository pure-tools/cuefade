<div class="bg-zinc-900 border-t border-zinc-800">
  <!-- Main controls row -->
  <div class="flex items-center gap-5 px-5 py-4">
    <!-- Play/Pause -->
    <button
      class="w-14 h-14 rounded-full text-white hover:bg-white/10 flex items-center justify-center transition-colors flex-shrink-0"
      (click)="togglePlay()"
      [title]="isPlaying() ? 'Pause' : 'Play'"
    >
      @if (isPlaying()) {
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
      } @else {
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
      }
    </button>

    <!-- Current track info -->
    <div class="flex-1 min-w-0">
      @if (queue.currentTrack(); as track) {
        <p class="text-base font-medium text-yellow-400 truncate">{{ track.title }}</p>
        @if (track.artist) {
          <p class="text-sm text-zinc-500 truncate">{{ track.artist }}</p>
        }
      } @else {
        <p class="text-base text-zinc-600">No track playing</p>
      }
    </div>

    <!-- Fade now button -->
    <button
      class="text-sm font-medium px-5 py-2.5 rounded-lg border border-zinc-700 text-zinc-300 hover:border-yellow-400 hover:text-yellow-400 transition-colors flex-shrink-0 disabled:opacity-40 disabled:cursor-not-allowed"
      (click)="triggerCrossfade()"
      [disabled]="!queue.hasNext()"
      title="Crossfade to next track now"
    >Fade →</button>

    <!-- Fade duration — desktop only inline -->
    <div class="hidden md:flex items-center gap-1.5">
      <span class="text-sm text-zinc-600 mr-1">Fade</span>
      @for (dur of fadeDurations; track dur) {
        <button
          class="text-sm px-3 py-1.5 rounded transition-colors"
          [class.bg-yellow-400]="crossfade.transitionDuration() === dur"
          [class.text-zinc-950]="crossfade.transitionDuration() === dur"
          [class.text-zinc-500]="crossfade.transitionDuration() !== dur"
          [class.hover:text-zinc-300]="crossfade.transitionDuration() !== dur"
          (click)="setFadeDuration(dur)"
        >{{ dur }}s</button>
      }
    </div>
  </div>

  <!-- Fade duration row — mobile only -->
  <div class="flex items-center gap-2 px-5 pb-4 md:hidden">
    <span class="text-sm text-zinc-600 mr-1">Fade</span>
    @for (dur of fadeDurations; track dur) {
      <button
        class="text-sm px-4 py-2 rounded transition-colors"
        [class.bg-yellow-400]="crossfade.transitionDuration() === dur"
        [class.text-zinc-950]="crossfade.transitionDuration() === dur"
        [class.text-zinc-500]="crossfade.transitionDuration() !== dur"
        [class.hover:text-zinc-300]="crossfade.transitionDuration() !== dur"
        (click)="setFadeDuration(dur)"
      >{{ dur }}s</button>
    }
  </div>
</div>
