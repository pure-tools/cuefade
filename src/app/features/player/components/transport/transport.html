<div class="flex items-center gap-4 px-4 py-3 bg-zinc-900 border-t border-zinc-800">
    <!-- Play/Pause -->
    <button
      class="w-10 h-10 rounded-full text-white hover:bg-white/10 flex items-center justify-center transition-colors"
      (click)="togglePlay()"
      [title]="isPlaying() ? 'Pause' : 'Play'"
    >
      @if (isPlaying()) {
        <!-- Pause icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
      } @else {
        <!-- Play icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
      }
    </button>

  <!-- Current track info -->
  <div class="flex-1 min-w-0">
    @if (queue.currentTrack(); as track) {
      <p class="text-sm font-medium text-yellow-400 truncate">{{ track.title }}</p>
      @if (track.artist) {
        <p class="text-xs text-zinc-500 truncate">{{ track.artist }}</p>
      }
    } @else {
      <p class="text-sm text-zinc-600">No track playing</p>
    }
  </div>

  <!-- Controls -->
  <div class="flex items-center gap-3">
    <!-- Manual crossfade -->
    <button
      class="text-xs px-3 py-1.5 rounded border border-zinc-700 text-zinc-400 hover:border-yellow-400 hover:text-yellow-400 transition-colors"
      (click)="triggerCrossfade()"
      [disabled]="!queue.hasNext()"
      title="Crossfade to next track now"
    >
      Fade →
    </button>
  </div>

  <!-- Fade duration selector -->
  <div class="flex items-center gap-1">
    <span class="text-xs text-zinc-600 mr-1">Fade</span>
    @for (dur of fadeDurations; track dur) {
      <button
        class="text-xs px-2 py-1 rounded transition-colors"
        [class.bg-yellow-400]="crossfade.transitionDuration() === dur"
        [class.text-zinc-950]="crossfade.transitionDuration() === dur"
        [class.text-zinc-500]="crossfade.transitionDuration() !== dur"
        [class.hover:text-zinc-300]="crossfade.transitionDuration() !== dur"
        (click)="setFadeDuration(dur)"
      >{{ dur }}s</button>
    }
  </div>
</div>
